<section class="panel">
 <header><h2>ALL VEYLITH PROJECTS</h2><span>{{(data().projects||[]).length}} PROJECTS</span></header>
 <div class="projects">
  @for(project of data().projects||[];track project.id||$index){
   <article [class]="state(project)">
    <div><i></i><strong>{{name(project)}}</strong><small>{{progress(project)|number:'1.0-0'}}% {{state(project).toUpperCase()}}</small></div>
    <span><b [style.width.%]="progress(project)"></b></span>
   </article>
  }
 </div>
</section>
