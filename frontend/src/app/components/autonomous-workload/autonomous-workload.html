<section class="panel">
 <header><h2>AUTONOMOUS WORKLOAD</h2><span>AGENT PHASES</span></header>
 <div class="workload">
  @for(agent of agents();track agent.id||$index){
   <div class="row">
    <span>{{name(agent)}}</span>
    <div><i [style.width.%]="width(agent)" [class]="state(agent)"></i></div>
    <b>{{state(agent).toUpperCase()}}</b>
   </div>
  }
 </div>
</section>
