<section class="panel">
 <header><h2>PROJECT PORTFOLIO</h2><span>LIVE</span></header>
 <div class="body">
  <div class="donut"><strong>{{counts().total}}</strong><small>PROJECTS</small></div>
  <div class="legend">
   <span><i class="active"></i>ACTIVE <b>{{counts().active}}</b></span>
   <span><i class="queued"></i>QUEUED <b>{{counts().queued}}</b></span>
   <span><i class="done"></i>COMPLETED <b>{{counts().completed}}</b></span>
   <span><i class="failed"></i>FAILED <b>{{counts().failed}}</b></span>
  </div>
 </div>
</section>
