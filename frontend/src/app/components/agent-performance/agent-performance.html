<section class="panel">
 <header><h2>AGENT PERFORMANCE</h2><span>9 AGENTS</span></header>
 <div class="agents">
  @for(agent of agents();track agent.id||$index){
   <div class="agent" [class]="state(agent)">
    <strong>{{label(agent)}}</strong>
    <small><i></i>{{state(agent).toUpperCase()}}</small>
   </div>
  }
 </div>
</section>
