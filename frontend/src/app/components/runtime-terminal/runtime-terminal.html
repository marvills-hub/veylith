<section class="panel terminal">
 <header>
  <h2>RUNTIME TERMINAL</h2>

  <span [class.live]="live()">
   <i></i>
   {{live()?'LIVE STREAM':'RECONNECTING'}}
  </span>
 </header>

 <div #feedEl class="rows">
  @for(
   event of runtimeRows();
   track $index
  ){
   <div class="row">
    <time>
     {{time(event)}}
    </time>

    <b [class]="cls(event)">
     {{type(event)}}
    </b>

    <p>
     {{message(event)}}
    </p>
   </div>
  }@empty{
   <div class="empty">
    Waiting for Veylith runtime activity...
   </div>
  }
 </div>
</section>
