<section class="panel">
 <header><h2>PROJECT EXECUTION OVERVIEW</h2><span>LIVE</span></header>
 <div class="content">
  <div class="stats">
   <div><i class="queued"></i>QUEUED <b>{{counts().queued}}</b></div>
   <div><i class="active"></i>ACTIVE <b>{{counts().active}}</b></div>
   <div><i class="done"></i>COMPLETE <b>{{counts().completed}}</b></div>
   <div><i class="failed"></i>FAILED <b>{{counts().failed}}</b></div>
  </div>
  <div class="current">
   @if(worker()){
    <small>● ACTIVE EXECUTION</small>
    <strong>{{role()}} IS WORKING</strong>
   }@else{
    <small>● NO ACTIVE EXECUTION</small>
    <strong>Veylith is waiting for executable work</strong>
   }
  </div>
 </div>
</section>
