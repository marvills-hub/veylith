<main class="dashboard">
 <section class="left">
  <app-header [live]="dashboard.connected()"></app-header>
  <app-runtime-terminal
 [events]="dashboard.runtimeEvents()"
 [live]="dashboard.streamConnected()">
</app-runtime-terminal>
  <app-agent-performance [data]="dashboard.data()"></app-agent-performance>
  <app-project-monitor [data]="dashboard.data()"></app-project-monitor>
  <app-project-execution [data]="dashboard.data()"></app-project-execution>
 </section>

 <section class="center">
  
  <app-veylith-stage></app-veylith-stage>
  <app-development-terminal [data]="dashboard.data()"></app-development-terminal>
 </section>

 <aside class="right">
  <div class="summary">
   <app-project-portfolio [data]="dashboard.data()"></app-project-portfolio>
   <app-project-velocity [data]="dashboard.data()"></app-project-velocity>
  </div>
  <app-autonomous-workload [data]="dashboard.data()"></app-autonomous-workload>
  <app-delivery-forecast [data]="dashboard.data()"></app-delivery-forecast>
  <app-project-roadmap [data]="dashboard.data()"></app-project-roadmap>
 </aside>
</main>

<app-system-monitor [data]="dashboard.data()"></app-system-monitor>
